name: Build Mega Drive ROM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify asset payloads
        run: sha256sum assets_v4/*.dat

      - name: Generate original Freakadelicos art
        run: |
          python3 tools/build_assets_v4.py
          echo "=== GENERATED ASSETS ==="
          ls -lh res/*.bmp

      - name: Allow SGDK container writes
        run: chmod -R a+rwX .

      - name: Build ROM with SGDK
        run: docker run --rm -v "$PWD:/m68k" -t ghcr.io/rhargreaves/docker-sgdk:v2.00

      - name: Check output
        run: |
          ls -lah out
          test -f out/rom.bin
          cp out/rom.bin out/Freakadelicos_MegaDrive_SGDK_v4_ORIGINAL_ART.bin

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: freakadelicos-v4-original-art
          path: |
            out/rom.bin
            out/Freakadelicos_MegaDrive_SGDK_v4_ORIGINAL_ART.bin
