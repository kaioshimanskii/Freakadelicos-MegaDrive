name: Build Mega Drive ROM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ROM with SGDK
        run: docker run --rm -v "$PWD:/m68k" -t ghcr.io/rhargreaves/docker-sgdk:v2.00
      - name: Check output
        run: ls -lah out && test -f out/rom.bin
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: freakadelicos-rom
          path: out/rom.bin
